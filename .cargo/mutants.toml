additional_cargo_args = ["--locked"]
all_features = true
# A denied lint would turn a mutant into a build failure, and a mutant that does not build is not
# counted as missed.
cap_lints = true

# A wipe on drop can be observed only through the memory of a value already dropped, which takes
# unsafe code, and unsafe code is forbidden here. The drop calls `Key::wipe`, which is tested.
exclude_re = [
  '^crates/lethewis-core/src/key\.rs:[0-9]+:[0-9]+: replace <impl Drop for Key>::drop with \(\)$',
]
