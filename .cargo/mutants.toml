additional_cargo_args = ["--locked"]
all_features = true
# A denied lint would turn a mutant into a build failure, and a mutant that does not build is not
# counted as missed.
cap_lints = true

# A wipe on drop can be observed only through the memory of a value already dropped, which takes
# unsafe code, and unsafe code is forbidden here. The drops call `Key::wipe` and `KeyId::wipe`,
# which are tested.
# Code under cfg(kani), the modules `proofs` and `model`, is compiled only by Kani, which a mutant run
# does not invoke. The proofs are checked against deliberate errors instead.
# lethewis-dit acts only on aarch64 where the system reports data-independent timing: the mutants of
# its detection on Linux run on aarch64 Linux, the others of its aarch64 code and of its guard on
# macOS, and those of its inert code here.
exclude_re = [
  '^crates/lethewis-dit/src/(lib|aarch64)\.rs:',
  '^crates/lethewis-core/src/key\.rs:[0-9]+:[0-9]+: replace <impl Drop for Key>::drop with \(\)$',
  '^crates/lethewis-core/src/derive\.rs:[0-9]+:[0-9]+: replace <impl Drop for KeyId>::drop with \(\)$',
  '^crates/lethewis-core/src/[a-z_]+\.rs:[0-9]+:[0-9]+: .* (proofs|model)::',
]
