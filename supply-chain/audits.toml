[[audits.cipher]]
who = "Alan Wisper <https://alanwisper.com>"
criteria = "read-in-full"
version = "0.5.2"
notes = """
Files read: Cargo.toml, Cargo.toml.orig, README.md (compiled in as the crate documentation by
include_str!), src/lib.rs, src/block.rs, src/block/backends.rs, src/block/ctx.rs, src/stream.rs,
src/stream/core_api.rs, src/stream/errors.rs, src/stream/wrapper.rs, src/tweak.rs,
src/tweak/ctx.rs, src/tweak/zero.rs, and, behind the dev feature, off here, src/dev.rs and
src/dev/*.rs. The archive matches the repository at the commit in .cargo_vcs_info.json apart
from the files cargo generates.

No unsafe code: lib.rs:8 is #![forbid(unsafe_code)]. No build script (build = false), no
procedural macros; impl_seek_num and impl_counter are macro_rules. No target-specific code, no
access to the system, files, network or environment.

Features: stream-wrapper is on here, through ctr, and adds block-buffer and
StreamCipherCoreWrapper. alloc, block-padding, dev, getrandom, rand_core and zeroize are off.
The zeroize feature adds only a re-export and ZeroizeOnDrop marker impls (wrapper.rs:213-228);
the crate has no wiping code of its own.

Path used here, through aes-gcm-siv and ctr: BlockCipherEncrypt::encrypt_block (block.rs:52) and
its impl for &Alg (block.rs:141); StreamCipherCore::apply_keystream_partial (core_api.rs:144),
which calls try_apply_keystream_partial (core_api.rs:102) and then process_with_backend with
ApplyBlocksCtx (core_api.rs:266) and the default gen_tail_blocks. StreamCipherCoreWrapper is built
but not used on this path.

try_apply_keystream_partial compares buf.len() / block size with remaining_blocks and returns an
error before it touches the buffer. Read with the meaning given at core_api.rs:107, the check
never accepts more blocks than remain, and it rejects a buffer that ends exactly at the end of the
last keystream block. Whole blocks are processed in place through the InOutBuf; a partial tail is
copied into a local block (core_api.rs:127), processed there, and copied back.

Secrets and copies, none cleared: the local tail block keeps the tail output and the rest of its
keystream block (core_api.rs:127-131); keystream blocks stay in locals at core_api.rs:252, 273,
278 and 286, the one at 278 a ParBlocksSize array even for a single block; xor_in2out in inout
adds a copy of each input block and of each output block. Keystream XOR ciphertext gives the
plaintext. StreamCipherCoreWrapper keeps unused keystream in a block-buffer ReadBuffer, which is
cleared on drop only through the zeroize feature of block-buffer; its Clone copies that buffer,
its Debug prints nothing. ZeroTweak derives Debug and Clone from the wrapped cipher.

No branch or memory index depends on data or keystream; branches use lengths, ParBlocksSize and
counter positions only. Panics: apply_keystream_partial when the check fails, the panicking
StreamCipher methods at the end of the keystream, and gen_tail_blocks and the tail-block backend
methods on a tail of ParBlocksSize blocks or more, which no caller in this crate passes.

Not used here: SeekNum::into_block_byte for i32 (stream.rs:310) panics on a negative position,
so try_seek with a negative i32 panics instead of returning an error. block_mode_test!
(dev/block_mode.rs:100) ignores its test function and expands to block_cipher_test!.
"""

[[audits.cmov]]
who = "Alan Wisper <https://alanwisper.com>"
criteria = "read-in-full"
version = "0.5.4"
notes = """
Files read: Cargo.toml, Cargo.toml.orig, README.md (compiled in as the crate documentation by
include_str!), src/lib.rs, src/macros.rs, src/array.rs, src/slice.rs, src/backends.rs,
src/backends/x86.rs, src/backends/aarch64.rs, src/backends/soft.rs. The archive matches the
repository at the commit in .cargo_vcs_info.json apart from the files cargo generates.

No build script (build = false), no dependencies, no procedural macros, no #[target_feature]. No
access to the system, files, network or environment.

Backend by target (backends.rs): x86 and x86_64 use x86.rs, aarch64 uses aarch64.rs, every other
target and Miri use soft.rs. soft.rs selects with (a & !mask) | (b & mask) (soft.rs:218). On arm
the mask comes from inline assembly; on wasm32 it is arithmetic behind core::hint::black_box,
which does not guarantee branch-free code.

Inline assembly, each block sound as read; none touches memory or the stack, and none claims to
preserve flags:
- x86.rs:16, cmov!: an 8-bit TEST of the condition, then CMOVNZ or CMOVZ on 32- or 64-bit
  registers; for u16 the upper bits are dropped on output.
- x86.rs:33, cmov_eq!: XOR at the operand width, then CMOVZ or CMOVNZ moves the input condition
  into the output, both widened to u16.
- aarch64.rs:8, csel!: TST of the condition against 0xff, then CSEL dst, src, dst.
- aarch64.rs:27, cseleq!: EOR into a scratch register, then TST against 0xffff for u16 or CMP
  with 0 for u32 and u64, then CSEL; unspecified upper register bits of the u8 condition and of
  u16 operands do not affect the result.
- soft.rs:151, arm: RSBS and SBCS turn a u32 into 0 or all ones without a branch. masknz64
  (soft.rs:202) ORs the masks of both halves.
- soft.rs:167 and 189: riscv32 and riscv64 only.

Other unsafe code:
- lib.rs:280: NonZero::new_unchecked on the result of cmovnz between two non-zero values.
- lib.rs:326: reads the i8 produced by cmovnz between two Ordering values as an Ordering.
- slice.rs:170, 171, 270 and 271: cast_slice_mut and cast_slice (unsafe fns at slice.rs:311 and
  331, blocks at 321 and 341) between signed, unsigned, NonZero and Ordering slices of equal size
  and alignment, asserted at compile time. Through the mutable cast every element ends up equal
  to one of two valid values, because each mask is all zeros or all ones.
- slice.rs:425, 428, 446, 449, 462, 470, 482 and 490: as_chunks copied from core: a split at a
  multiple of N, then a cast to [T; N] chunks.

The default cmovz (lib.rs:47), used for isize, usize, NonZero, Ordering, slices and arrays,
inverts the condition with the black_box macro and then calls cmovnz. The generated machine code
was not inspected. The crate keeps no state and wipes nothing; secret words pass through
registers and stack temporaries. CSEL timing is architecturally data independent only with
