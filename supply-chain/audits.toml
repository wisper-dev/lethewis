
# cargo-vet audits file

[criteria.read-in-full]
description = """
Every file of the published archive that can be built into a dependent, namely the manifest, any
build script, every source file and every file a source file includes with include_str! or
include_bytes!, has been read in full, and the archive's checksum matches the lockfile. The review
covered every unsafe block, build scripts, procedural macros, and access to the system, files and
network, and, where the crate handles secrets, branches and memory accesses that depend on them.
"""
implies = "safe-to-deploy"

[[audits.block-buffer]]
who = "Alan Wisper <https://alanwisper.com>"
criteria = "read-in-full"
version = "0.12.1"
notes = """
Files read: Cargo.toml, Cargo.toml.orig, src/lib.rs, src/read.rs, src/sealed.rs. README.md is not
compiled in. The archive matches the repository at the commit in .cargo_vcs_info.json apart from
the files cargo generates.

No build script (build = false), no procedural macros, no include_str! or include_bytes!. No
access to the system, files, network or environment. Dependencies: hybrid-array, and zeroize
behind the zeroize feature, which is on here.

What the buffer holds: the bytes of an incomplete block. Whole input blocks go to the compress
closure straight from the caller's slice. Branches and offsets depend only on the position and
input lengths, never on byte values, except in deserialize (lib.rs:348) and
ReadBuffer::deserialize (read.rs:172), which test serialized bytes for zero with an early exit.

Wiping: Drop (lib.rs:433) calls zeroize (lib.rs:425), one volatile write of the whole block, the
Eager position byte included; the Lazy position is zeroed as well (lib.rs:429). reset
(lib.rs:217) and ResetGuard (lib.rs:445) change only the position: buffered bytes stay until
overwritten or dropped. pad_with_zeros (lib.rs:226), serialize (lib.rs:325) and Clone
(lib.rs:109) return copies the crate does not wipe. Debug (lib.rs:118) prints the buffered bytes.

Unsafe code, each use sound as read:
- lib.rs:114, Clone: ptr::read of self. Both fields are plain bytes and own nothing, and each
  copy wipes itself on drop. The SAFETY comment at lib.rs:112 says the type has no Drop;
  lib.rs:433 has one.
- lib.rs:151, try_new: set_data_unchecked after the length check at lib.rs:146.
- lib.rs:177, digest_blocks: copies n bytes at pos; K::invariant(n, rem) keeps them inside the
  block and, for Eager, below the position byte.
- lib.rs:195: fills the block from pos to its end, then assume_init_ref; the bytes before pos are
  initialized by the invariant. For Eager this overwrites the position byte; the ResetGuard made
  at lib.rs:188 sets the position to 0 at the end of the scope, on unwind as well.
- lib.rs:210: set_data_unchecked with the leftover, shorter than a block for Eager and at most a
  block for Lazy.
- lib.rs:219, reset: position 0.
- lib.rs:241, get_pos: unreachable_unchecked if the position breaks the invariant; every writer
  in the crate keeps it.
- lib.rs:253, get_data: the first get_pos() bytes, initialized by the invariant.
- lib.rs:266, set: after the assert at lib.rs:262 and a write of the whole block.
- lib.rs:292 and 304, unsafe fns set_pos_unchecked and set_data_unchecked: the position first,
  then buf.len() bytes from offset 0, below the Eager position byte. Every caller passes a value
  within the kind invariant.
- lib.rs:353, deserialize: after the invariant check at lib.rs:342.
- lib.rs:386, digest_pad: writes delim and zeros to the end of the block, then assume_init_mut;
  the ResetGuard made at lib.rs:382 restores the position on return and on unwind.
- sealed.rs:41 and 53, Eager get_pos and set_pos: read and write byte N - 1 of the block.
- read.rs:26, 88 and 125: set_pos_unchecked with 1 <= pos <= block size; read.rs:72 is an unsafe
  fn whose body is safe indexing; read.rs:47, ReadBuffer::get_pos: unreachable_unchecked if the
  cursor is 0 or above the block size; every writer keeps it in range.

Unsound, not reached here: the sealed get_pos and set_pos (sealed.rs:39, 50) are safe functions
over any ArraySize, and a dependent can call them through a K: BufferKind bound; given an
uninitialized block, or N = U0 in a release build, they read uninitialized memory or go out of
bounds. digest, hmac, sha2 and hkdf call only the public methods of BlockBuffer.
"""

