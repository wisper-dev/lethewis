
# cargo-vet audits file

[criteria.read-in-full]
description = """
Every file of the published archive that can be built into a dependent, namely the manifest, any
build script, every source file and every file a source file includes with include_str! or
include_bytes!, has been read in full, and the archive's checksum matches the lockfile. The review
covered every unsafe block, build scripts, procedural macros, and access to the system, files and
network, and, where the crate handles secrets, branches and memory accesses that depend on them.
"""
implies = "safe-to-deploy"

[[audits.aead]]
who = "Alan Wisper <https://alanwisper.com>"
criteria = "read-in-full"
version = "0.6.1"
notes = """
Files read: Cargo.toml, Cargo.toml.orig, README.md (compiled in as the crate documentation by
include_str!), src/lib.rs, and src/dev.rs behind the dev feature, off here. The archive matches
the repository at the commit in .cargo_vcs_info.json apart from the files cargo generates.

No unsafe code: lib.rs:8 is #![forbid(unsafe_code)]. No build script (build = false), no
procedural macros; new_pass_test! and new_fail_test! in dev.rs are macro_rules that expand in
the calling test crate with include_bytes!. No access to the system, files, network or
environment. Dependencies: crypto-common and inout; arrayvec, blobby and bytes are optional. All
features are off here, the default rand_core included, so Aead, the Buffer impls for Vec,
BytesMut and ArrayVec, Generate and dev are not built.

Traits and types only; the crate holds no secret state. Nonce<A>, Tag<A> and the re-exported Key
are Array<u8, N>: Copy, without Drop, and without Zeroize while the zeroize feature of
hybrid-array is off, so every by-value copy stays uncleared. Error is a unit struct.

AeadInOut (lib.rs:220): the implementation supplies encrypt_inout_detached and
decrypt_inout_detached, and the trait states nothing about the buffer contents after an error.
encrypt_in_place and decrypt_in_place (lib.rs:258, 292) work through the dyn Buffer trait. For a
postfix tag, encrypt_in_place encrypts the buffer and only then appends the tag (lib.rs:276-278);
if the buffer cannot grow, it returns an error with the ciphertext in place and the tag dropped,
leaving neither the plaintext nor a ciphertext the trait can decrypt. The prefix branch grows the
buffer first. decrypt_in_place leaves the buffer untruncated on error; for a prefix tag it moves
the plaintext down and truncates (lib.rs:306, 314), which leaves the last TagSize bytes of the
plaintext past the new length.

AeadInPlace (lib.rs:324) is deprecated since 0.6.0 but implemented for every AeadInOut
(lib.rs:373), so encrypt_in_place, encrypt_in_place_detached, decrypt_in_place and
decrypt_in_place_detached remain callable with a deprecation warning. The detached forms pass the
&mut [u8] as an in-place InOutBuf to the AeadInOut methods (lib.rs:389, 408) and leave the
buffer on error as the implementation leaves it.

Payload (lib.rs:420) is built without features and derives Debug, which prints the message and
the associated data. The documentation of TagSize (lib.rs:122) calls it the maximum tag length;
the crate uses it as the exact length. No branch depends on data; the in-place methods branch on
TAG_POSITION and on lengths only.
"""

[[audits.aes]]
who = "Alan Wisper <https://alanwisper.com>"
criteria = "read-in-full"
version = "0.9.3"
notes = """
Files read: Cargo.toml, Cargo.toml.orig, src/lib.rs, src/backends.rs, src/backends/soft.rs, in
src/backends/fixslice/: mod.rs, word.rs, utils.rs, sbox.rs, mix_columns.rs, aes128.rs, aes192.rs,
aes256.rs; src/backends/x86_aes.rs with x86_aes/encdec.rs, expand.rs, utils.rs;
src/backends/x86_vaes256.rs with x86_vaes256/encdec.rs; src/backends/x86_vaes512.rs with
x86_vaes512/encdec.rs; src/backends/aarch64_aes.rs with aarch64_aes/encdec.rs, expand.rs, utils.rs;
and, behind the hazmat feature, off here, src/hazmat.rs, fixslice/hazmat.rs, x86_aes/hazmat.rs,
aarch64_aes/hazmat.rs. README.md is not compiled in. The archive matches the repository at the
commit in .cargo_vcs_info.json, tagged aes-v0.9.3, apart from the files cargo generates.

No build script (build = false), no procedural macros, no include_str! or include_bytes!, no
inline assembly. No access to files, network or environment. CPU features come from
cpufeatures::new! (lib.rs:152-154, 174): CPUID and XGETBV on x86, getauxval(AT_HWCAP) on aarch64
Linux and Android, a constant on Apple targets. Dependencies: cipher; cpubits, macro_rules only;
zeroize behind the zeroize feature, which is on here; cpufeatures on aarch64, x86 and x86_64 only.

Backends. On x86_64, encrypt and decrypt (lib.rs:262-302, 312-352) try in turn VAES-512 (avx512f
and vaes), VAES-256 (vaes), AES-NI (aes), then the portable fixsliced backend. cpufeatures 0.3.1
checks vaes together with the ZMM state in XCR0, so CPUs with VAES but without AVX-512 state take
AES-NI. On aarch64: ARMv8 AES, else portable. On thumbv7em and wasm32: portable only. cpubits
chooses 64-bit words on 64-bit targets and on wasm32, and 32-bit words on thumbv7em with the
stable compiler, which reports no arm target features. --cfg aes_backend = "soft" removes every
hardware backend; no cfg removes VAES alone.

Timing. The portable backend uses only bitwise operations and rotations by constant amounts; every
array index and loop bound is a constant or a counter; the only multiplications (word.rs:71, 81,
178, 191) take constant arguments at every call site. The hardware paths use the AES
instructions, AESKEYGENASSIST on x86 and AESE with a zero key for SubWord on aarch64
(aarch64_aes/expand.rs:82); their branches depend on round indices only. No branch and no memory
address depends on the key or the data in any path. lib.rs:19-23 and README.md claim constant time
on this basis; there are no optimization barriers, and the generated code was not inspected. On
aarch64 PSTATE.DIT is not set.

Secrets. Each public type holds a union (lib.rs:452-485) of the hardware and the portable schedule
plus a zero-sized Token. For AES-256 the portable schedule is [u64; 120], 960 bytes, or [u32; 120]
on 32-bit words; the x86 and aarch64 schedules are 15 round keys of 16 bytes for encryption, in
Aes256 and Aes256Enc, and for decryption, in Aes256 and Aes256Dec. Aes256 is 960 bytes on
x86_64, aarch64 and wasm32 and 480 on thumbv7em. With the zeroize feature, Drop
(lib.rs:424-432) passes the whole struct to zeroize_flat_type, so the union is wiped whichever
variant is live; the volatile writes cover it, and the barrier receives the address of the
pointer variable. All nine types are marked ZeroizeOnDrop; Debug prints no key material. Not
wiped:
- key expansion temporaries: the portable rkeys, broadcast key blocks and bitslice words
  (aes256.rs:8-11, utils.rs:9, word.rs:100, 222), the x86 key halves copied into a Block
  (x86_aes/expand.rs:204), the local schedule arrays (x86_aes/expand.rs:172, 192;
  aarch64_aes/expand.rs:21, 65); each schedule is returned by value and moved into the union and
  then into the struct;
- the schedule copies made by From<&Aes256Enc> for Aes256 and for Aes256Dec (lib.rs:391,
  x86_aes.rs:101, aarch64_aes.rs:100);
- on VAES, every encrypt and decrypt call builds rk4 or rk2 (x86_vaes512.rs:25, 33;
  x86_vaes256.rs:25, 33): the whole schedule broadcast to 64- or 32-byte lanes, 960 or 480 bytes
  for AES-256, whose first two round keys are the key; it stays in the stack frame;
- portable single-block calls (soft.rs:48-53, 64-69) process a full batch with the other slots
  zero, so the frame keeps E_K(0) or D_K(0) next to the result;
- bitsliced state, register spills and vector registers on every path, and copies left by moves
  of the cipher value.

Unsafe code, each use sound as read unless stated otherwise:
- lib.rs:236, 243: target_feature constructors after token.aes.get() at lib.rs:234, 241.
- lib.rs:284-286, 292-294, 334-336, 342-344: read of inner.aes and call of the target_feature
  method after token.aes.get(); new stores the aes variant exactly when that check passed.
- lib.rs:372-374, 381-383: as_encdec and as_dec after token.aes.get().
- lib.rs:301, 351, 391: read of inner.soft, reached only when aes is not detected or no hardware
  backend is compiled.
- lib.rs:268-270, 276-278, 318-320, 326-328: not sound. The VAES branches test only vaes512 or
  vaes256, not aes, then read inner.aes and call functions compiled with target_feature vaes,
  which in rustc implies aes and avx2. If CPUID reports VAES (with AVX512F and ZMM state) but not
  AES-NI, the union holds the portable schedule: its words are used as AES round keys (no
  uninitialized read in this version, since the portable variant is never smaller), and AES-NI
  code runs unchecked (x86_vaes512.rs:58, 74; x86_vaes256.rs:56, 72). The result is output that
  is not AES, or an illegal instruction.
- lib.rs:428: zeroize_flat_type(self) in Drop; the union fields are Copy arrays, Token is
  zero-sized, and all-zero is valid for each.
- x86_aes.rs:65, 72, 81, 88, 133, 140, 170, 177 and aarch64_aes.rs:64, 71, 80, 87, 132, 139,
  169, 176: target_feature calls from backend trait methods; values of these types are made only
  by target_feature constructors after the aes check, or copied from such values.
- x86_vaes256.rs:63, 79 and x86_vaes512.rs:65, 81: batch calls on a backend that exists only
  inside the VAES target_feature functions.
- x86_aes/utils.rs:13, 20 and aarch64_aes/utils.rs:7, 13: unaligned 16-byte load and store of a
  Block.
- x86_vaes256/encdec.rs:94, 109 and x86_vaes512/encdec.rs:94, 109: unaligned 32- and 64-byte
  loads and stores at index i below N/2 or N/4; N % 2 == 0 and N % 4 == 0 are asserted at compile
  time.
- aarch64_aes/expand.rs:27: [uint8x16_t; RK] viewed as RK * 4 u32 words, alignment asserted at
  expand.rs:24; the array is not touched while the slice is live.
- hazmat.rs:39, behind hazmat: round intrinsics after features_aes::get().

cpufeatures 0.3.1 reads CPUID leaf 7 without checking the maximum basic leaf. The aes bit comes
from leaf 1; vaes and avx512f also require the ZMM bits of XCR0, which an operating system sets
only after enumerating leaf 0xD, so a stale leaf 7 is not expected to select VAES; not verified
for every operating system and hypervisor.

lib.rs:48-49 and 107-108 document aes_backend = "avx256" and "avx512", which this version
removed; VAES is detected at run time by default. lib.rs:25 names an aes_compact flag; the cfg is
aes_backend_soft = "compact".
"""

[[audits.aes-gcm-siv]]
who = "Alan Wisper <https://alanwisper.com>"
criteria = "read-in-full"
version = "0.12.1"
notes = """
Files read: Cargo.toml, Cargo.toml.orig, README.md (compiled in as the crate documentation by
include_str!), src/lib.rs. The archive matches the repository at the commit in
.cargo_vcs_info.json, tagged aes-gcm-siv-v0.12.1, apart from the files cargo generates. Also read,
not built into dependents: tests/aes128gcmsiv.rs, tests/aes256gcmsiv.rs, tests/ctr_wrap.rs,
tests/common/mod.rs.

No build script (build = false), no procedural macros, no unsafe code, no access to the system,
files, network or environment. Dependencies: aead and polyval with default features off, cipher,
ctr, ctutils; aes and zeroize are optional and both on here. alloc, getrandom, rand_core,
arrayvec and bytes only pass through to aead and are off here.

Path used here: Aes256GcmSiv in place, through AeadInOut::encrypt_inout_detached and
decrypt_inout_detached (lib.rs:177, 187). Nonce is Array<u8, U12> and Tag is Array<u8, U16>
(lib.rs:114, 117), Copy arrays without Drop. AesGcmSiv holds the AES schedule of the
key-generating key by value (lib.rs:132). Each call builds a Cipher (lib.rs:229): six AES blocks
of a little-endian 32-bit counter 0 to 5 followed by the nonce, the first 8 bytes of each kept,
counters 0 and 1 giving the POLYVAL key and 2 to 5 the encryption key (lib.rs:250-260), as in
RFC 8452 section 4. finish_tag (lib.rs:332) hashes the length block, the bit lengths of AAD and
data as LE64, XORs the nonce into the first 12 bytes of the POLYVAL output, clears the top bit of
byte 15 and encrypts the block with the encryption key. init_ctr (lib.rs:363) sets the top bit of
byte 15 of the tag and starts ctr's Ctr32LE core over a reference to the encryption key, so the
schedule is not copied.

Order: encrypt (lib.rs:282) checks lengths, hashes AAD and plaintext, computes the tag, then
applies the keystream. decrypt (lib.rs:302) checks lengths, hashes AAD, applies the keystream,
hashes the result and compares the computed tag with the given one through ctutils CtEq for
[u8], reached through Deref (lib.rs:320-321); with hybrid-array's ctutils feature on, the Array
impl compares the same 16 bytes. Besides the length checks, the comparison result is the only
branch. On mismatch the keystream is applied to the buffer again (lib.rs:326). In place, the
buffer returns to the given ciphertext. With separate input and output buffers the output keeps
the decrypted, unauthenticated data: a ciphertext altered with its tag kept leaves the true
plaintext with the same bits flipped. Both were observed in a test run.

Length checks: AAD up to A_MAX and plaintext up to P_MAX, both 2^36 bytes (lib.rs:287). decrypt
checks the detached ciphertext against C_MAX = 2^36 + 16 (lib.rs:308), which counts a tag the
buffer does not contain. cipher's apply_keystream_partial panics at 2^36 bytes and above with
ctr's 32-bit counter, so encrypting exactly P_MAX bytes, and decrypting 2^36 to 2^36 + 16 bytes,
panic instead of returning an error; the decrypt panic was observed. Empty plaintext and empty
AAD need no special case and round-trip.

Secrets and wiping: the zeroize feature clears only the local mac_key, enc_key and block arrays
after the Cipher is built (lib.rs:270-276). It does not turn on the zeroize features of aes,
polyval or ctr, so the key-generating key schedule in AesGcmSiv, the per-message AES schedule and
POLYVAL state in Cipher (lib.rs:209), and the POLYVAL clone made by finalize_reset (lib.rs:341)
are cleared on drop only when those features are enabled elsewhere. AesGcmSiv derives Clone
(lib.rs:131); Debug prints no state (lib.rs:202). Not cleared in any configuration: the computed
tag on decrypt (lib.rs:318), copies of key material left on the stack by moves and by key
expansion in aes and polyval, and keystream and plaintext in the stack temporaries of cipher and
universal-hash. A stack scan after one in-place call on 92 bytes, in a release build on x86_64
with the hardware and the portable backends, found the POLYVAL key, the encryption key and the
plaintext or keystream of the final partial block within 4 KiB below the caller's stack pointer,
with and without the zeroize features of aes and polyval; building AesGcmSiv left copies of the
key-generating key. No branch or memory index depends on keys, data or tag bytes.

Tests: RFC 8452 C.1, C.2 and C.3 through the allocating API, which calls the in-place inout
methods; Wycheproof subsets (AES-256: 45 valid vectors with plaintexts up to 64 bytes, 35
invalid) through the allocating API and, for valid vectors, out-of-place inout calls. Not tested:
the buffer contents after a failed decryption. All pass on x86_64 with the hardware and the
portable backends.
"""

[[audits.block-buffer]]
who = "Alan Wisper <https://alanwisper.com>"
criteria = "read-in-full"
version = "0.12.1"
notes = """
Files read: Cargo.toml, Cargo.toml.orig, src/lib.rs, src/read.rs, src/sealed.rs. README.md is not
compiled in. The archive matches the repository at the commit in .cargo_vcs_info.json apart from
the files cargo generates.

No build script (build = false), no procedural macros, no include_str! or include_bytes!. No
access to the system, files, network or environment. Dependencies: hybrid-array, and zeroize
behind the zeroize feature, which is on here.

What the buffer holds: the bytes of an incomplete block. Whole input blocks go to the compress
closure straight from the caller's slice. Branches and offsets depend only on the position and
input lengths, never on byte values, except in deserialize (lib.rs:348) and
ReadBuffer::deserialize (read.rs:172), which test serialized bytes for zero with an early exit.

Wiping: Drop (lib.rs:433) calls zeroize (lib.rs:425), one volatile write of the whole block, the
Eager position byte included; the Lazy position is zeroed as well (lib.rs:429). reset
(lib.rs:217) and ResetGuard (lib.rs:445) change only the position: buffered bytes stay until
overwritten or dropped. pad_with_zeros (lib.rs:226), serialize (lib.rs:325) and Clone
(lib.rs:109) return copies the crate does not wipe. Debug (lib.rs:118) prints the buffered bytes.

Unsafe code, each use sound as read:
- lib.rs:114, Clone: ptr::read of self. Both fields are plain bytes and own nothing, and each
  copy wipes itself on drop. The SAFETY comment at lib.rs:112 says the type has no Drop;
  lib.rs:433 has one.
- lib.rs:151, try_new: set_data_unchecked after the length check at lib.rs:146.
- lib.rs:177, digest_blocks: copies n bytes at pos; K::invariant(n, rem) keeps them inside the
  block and, for Eager, below the position byte.
- lib.rs:195: fills the block from pos to its end, then assume_init_ref; the bytes before pos are
  initialized by the invariant. For Eager this overwrites the position byte; the ResetGuard made
  at lib.rs:188 sets the position to 0 at the end of the scope, on unwind as well.
- lib.rs:210: set_data_unchecked with the leftover, shorter than a block for Eager and at most a
  block for Lazy.
- lib.rs:219, reset: position 0.
- lib.rs:241, get_pos: unreachable_unchecked if the position breaks the invariant; every writer
  in the crate keeps it.
- lib.rs:253, get_data: the first get_pos() bytes, initialized by the invariant.
- lib.rs:266, set: after the assert at lib.rs:262 and a write of the whole block.
- lib.rs:292 and 304, unsafe fns set_pos_unchecked and set_data_unchecked: the position first,
  then buf.len() bytes from offset 0, below the Eager position byte. Every caller passes a value
  within the kind invariant.
- lib.rs:353, deserialize: after the invariant check at lib.rs:342.
- lib.rs:386, digest_pad: writes delim and zeros to the end of the block, then assume_init_mut;
  the ResetGuard made at lib.rs:382 restores the position on return and on unwind.
- sealed.rs:41 and 53, Eager get_pos and set_pos: read and write byte N - 1 of the block.
- read.rs:26, 88 and 125: set_pos_unchecked with 1 <= pos <= block size; read.rs:72 is an unsafe
  fn whose body is safe indexing; read.rs:47, ReadBuffer::get_pos: unreachable_unchecked if the
  cursor is 0 or above the block size; every writer keeps it in range.

Unsound, not reached here: the sealed get_pos and set_pos (sealed.rs:39, 50) are safe functions
over any ArraySize, and a dependent can call them through a K: BufferKind bound; given an
uninitialized block, or N = U0 in a release build, they read uninitialized memory or go out of
bounds. digest, hmac, sha2 and hkdf call only the public methods of BlockBuffer.
"""

