[[audits.polyval]]
who = "Alan Wisper <https://alanwisper.com>"
criteria = "read-in-full"
version = "0.7.3"
notes = """
Files read: Cargo.toml, Cargo.toml.orig, README.md (compiled in as the crate documentation by
include_str!), src/lib.rs, src/hazmat.rs (behind the hazmat feature, off here), src/backend.rs,
src/backend/soft.rs, src/backend/intrinsics.rs, src/backend/intrinsics/x86.rs,
src/backend/intrinsics/armv8.rs, src/field_element.rs, src/field_element/mul32.rs,
src/field_element/mul64.rs, src/field_element/mulx.rs. The archive matches the repository at the
commit in .cargo_vcs_info.json, tagged polyval-v0.7.3, apart from the files cargo generates; it
was published by trusted publishing from that commit.

No build script (build = false), no procedural macros; cfg_if! and cpubits! are macro_rules from
cpubits. No access to the system, files, network or environment. Dependencies: cpubits,
universal-hash, cpufeatures on aarch64, x86 and x86_64, and zeroize behind the zeroize feature,
which is on here. The cfg flags polyval_backend = "soft" and cpubits = "16" | "32" | "64" change
the backend; none is set here.

Backend by target (backend.rs:1-13, field_element.rs:22-31): x86 and x86_64 use
intrinsics/x86.rs when CPUID reports AVX and PCLMULQDQ and XCR0 enables YMM state (x86.rs:34);
aarch64 uses intrinsics/armv8.rs when the cpufeatures aes check passes (armv8.rs:31), a constant
true on Apple targets. Otherwise, and on every other target, field multiplication is portable:
mul64.rs on 64-bit targets and wasm32, mul32.rs on other 32-bit targets. cpubits would also move
arm with target_feature = "v7" to mul64.rs, but a stable compiler does not expose that unstable
feature to cfg: thumbv7em builds mul32.rs on stable and mul64.rs on nightly.

Correctness: the R/F multiplication, the expansion to H^1..H^4 and D^1..D^4, the four-block
aggregated reduction and both portable multipliers were modelled bit for bit and agreed with a
direct GF(2^128) computation of POLYVAL, the specification's test vector included, on 300 random
and edge-case inputs.

Secrets. Polyval holds a State. On x86, x86_64 and aarch64 it is an ExpandedKey of H^1..H^4 and
D^1..D^4 (intrinsics.rs:92-109, 128 bytes, each value enough to recover the key; only h1 is filled
when the CPU check fails), the accumulator acc and a zero-sized InitToken. The portable State
(soft.rs:11-20) holds h and the accumulator y. Data blocks are read through references and copied
into FieldElement and u128 temporaries, SIMD registers and, in mul32.rs, the 18-word arrays a
(key words), b (acc ^ block words) and c (products) (mul32.rs:51-96).

Wiping: Drop (lib.rs:111) calls zeroize_flat_type on the whole Polyval: a volatile write of every
byte of the key powers, the D values and the accumulator, then the barrier, which receives the
address of the pointer variable rather than the data. The fields are byte arrays with no Drop and
no padding, and all zeros is valid for them, so the safety conditions of zeroize_flat_type hold.
Clone (lib.rs:45) yields a Polyval that wipes itself on drop. Not wiped: the Tag returned by
finalize (lib.rs:84), a copy of the accumulator; the key copy made by FieldElement::from(*h)
(intrinsics.rs:37, soft.rs:25); the local buffers of from_m128i and from_uint64x2_t (x86.rs:44,
armv8.rs:41) and the ExpandedKey value built by expand_key before it is moved into the State; the
mul32.rs arrays and every other stack and register temporary of a multiplication; and the bytes
left behind when a Polyval is moved. reset (lib.rs:100) clears only the accumulator, by a plain
store. Debug for Polyval prints no state (lib.rs:105). FieldElement, public only behind hazmat,
is Copy, implements Zeroize (field_element.rs:168) and prints its bytes in Debug
(field_element.rs:73).

Timing: no branch and no memory index depends on the key, the accumulator or the data; branches
test only the cached CPU check and block counts. The intrinsic paths use PCLMULQDQ or PMULL, XOR,
shuffles and shifts by constants. The portable paths use AND, OR, XOR, shifts by constants,
reverse_bits and integer multiplication truncated to the word (field_element.rs:203-206, called
from mul32.rs:95 and mul64.rs:34-36), so they are constant time only where the multiplier is. On
Cortex-M4, 32-bit MUL is single cycle; the 64-bit multiply of mul64.rs lowers to UMULL and MLA,
fixed time on Cortex-M4 but early-terminating UMULL on Cortex-M3. On wasm32 the timing of i64.mul
depends on the engine. The generated machine code was not inspected.

Unsafe code, each use sound as read:
- lib.rs:115-117, Drop: zeroize_flat_type(self), see Wiping.
- intrinsics.rs:32, 54, 63-65: calls of the target_feature functions expand_key, proc_block and
  proc_par_blocks after the cpufeatures check for the same features (intrinsics.rs:28, 83).
- x86.rs:21 and armv8.rs:21 allow unsafe operations in unsafe fns, so every function body in both
  files is an unsafe context. Memory is touched only by unaligned 16-byte loads from a &[u8; 16]
  (x86.rs:63, armv8.rs:60) and stores into a local [u8; 16] (x86.rs:45, armv8.rs:42), in bounds;
  every other intrinsic works on registers. The sse2 helpers are reached only from functions that
  require avx.

The aes check of cpufeatures on Linux and Android passes when either HWCAP_AES or HWCAP_PMULL is
set ((hwcaps & (AES | PMULL)) != 0); the kernel sets PMULL only together with AES, so a CPU with
AES but without PMULL would execute PMULL here and fault. README.md says the hardware path needs
AVX2 on x86 and the crypto target feature on other aarch64 platforms; the code checks AVX with
PCLMULQDQ, and the aes target feature.
"""

[[audits.sha2]]
who = "Alan Wisper <https://alanwisper.com>"
criteria = "read-in-full"
version = "0.11.0"
notes = """
Files read: Cargo.toml, Cargo.toml.orig, README.md (compiled in as the crate documentation by
include_str! at lib.rs:2), src/lib.rs, src/block_api.rs, src/consts.rs, src/sha256.rs,
src/sha512.rs, and every backend under src/sha256/ and src/sha512/: soft.rs, soft/unroll.rs,
soft/compact.rs, wasm32_simd128.rs, loongarch64_asm.rs, riscv_zknh.rs, riscv_zknh/utils.rs,
riscv_zknh/unroll.rs, riscv_zknh/compact.rs, plus sha256/x86_sha.rs, sha256/aarch64_sha2.rs,
sha512/x86_avx2.rs and sha512/aarch64_sha3.rs. The archive matches the repository at the commit
in .cargo_vcs_info.json apart from the files cargo generates.

No build script (build = false), no procedural macro, no access to files, network or
environment. CPU feature detection is delegated to cpufeatures::new! (sha256.rs:55, 58;
sha512.rs:50, 53). Round constants and initial hash values in consts.rs match their derivation.

Backend selection when no sha2_* cfg flag is set (sha256.rs:49-79, sha512.rs:44-74): the
portable backend (soft.rs, soft/unroll.rs) is always compiled. On x86_64, x86_sha.rs and
x86_avx2.rs are added and chosen at run time from CPUID. On aarch64, aarch64_sha2.rs and
aarch64_sha3.rs are added and chosen from AT_HWCAP on Linux and Android; Apple aarch64 targets
enable the sha2 target feature, so the SHA-256 check there is a constant true. On arm, thumbv7em
and wasm32 without simd128 only the portable backend is compiled.

Path used here: Sha256VarCore::update_blocks (block_api.rs:38) and finalize_variable_core
(block_api.rs:64) call compress256 (sha256.rs:86), which dispatches at sha256.rs:62-78.

Portable SHA-256 (soft/unroll.rs): repeat64! unrolls the 64 rounds with literal indices, so every
array index, the i < 16 test and the round constant address (rk, unroll.rs:26) are compile-time
constants. The data path is wrapping add, xor, and, not, and shifts and rotations by constants.
No branch and no memory address depends on the message or the state. The hardware backends have
no data-dependent branch or address either; on aarch64 PSTATE.DIT is not set.

With the zeroize feature, Drop zeroizes state and block_len of Sha256VarCore (block_api.rs:89)
and Sha512VarCore (block_api.rs:208). Not erased: copies made inside the compression functions
(message schedule and working variables on the stack or in vector registers), the digest written
to the caller's buffer (block_api.rs:69, 188), serialize() output (block_api.rs:106, 224), and
stale bytes left where a core value was moved from.

Unsafe code, each use sound as read unless stated otherwise:
- sha256.rs:67, 72 and sha512.rs:62, 67: calls to the target_feature backends after the
  cpufeatures check for the same features.
- sha256.rs:16, 31, 41 and sha512.rs:16, 26, 36: the same calls when a sha2_*_backend cfg forces
  a backend, behind compile_error! unless the features are enabled at compile time.
- sha256/soft/unroll.rs:39 and sha512/soft/unroll.rs:33: rk reads K32 or K64 at index i through
  a raw pointer; i is a literal below 64 or 80 from the unrolling macro.
- x86_sha.rs:13 and 45, target_feature unsafe fns: unaligned 16-byte loads of the state (54, 55)
  and the block (67-70) and stores of the state (100, 101), all in bounds.
- aarch64_sha2.rs:12, target_feature unsafe fn: NEON loads of the state (17, 18) and the block
  (27-30) and stores (92, 93), in bounds. Lines 33, 39, 45, 51, 59, 66, 73 and 80 load
  K32[t..t+4], t <= 60, through a pointer derived from &K32[t], a reference to one u32. The read
  stays inside K32 but exceeds that reference: Miri's stacked-borrows model rejects it, its
  tree-borrows model accepts it. This backend serves SHA-256 on aarch64 whenever the CPU has the
  SHA-256 instructions, and always on Apple aarch64 targets.
- x86_avx2.rs:17, 47, 60, 82, 115, 136 and 243: block pointer arithmetic and loads (31, 66, 98,
  99), two blocks at a time only once an odd count is made even (21-23, 30); K64 loads with
  indices below 80; 330 and 335 view [__m128i; N] as [u64; 2N], same size, lower alignment.
- aarch64_sha3.rs:10: NEON loads and stores of state and block, in bounds; K64[t..t+2] loads
  through &K64[t], the same reference-range pattern as in aarch64_sha2.rs.
- wasm32_simd128.rs, built only with the simd128 target feature: v128_load of the block and of
  the round constants, in bounds.
- riscv_zknh, nightly only: for an unaligned block the inline assembly reads the aligned words
  around it, up to 7 bytes outside the block, and ptr::read(bp.add(..)) offsets a pointer that
  may lie before the allocation; both are outside the Rust memory model. Not built here.
- loongarch64_asm.rs: one asm! each with 64 or 128 bytes of stack scratch, not erased. Not built
  here.

README.md documents per-algorithm backend flags that sha512.rs does not follow: lines 2 and 5
test sha2_256_backend. Forcing sha2_256_backend = "aarch64-sha2" (sha256.rs:39) or
sha2_512_backend = "x86-avx2" (sha512.rs:24) fails to compile on a wrong compress signature. No
sha2_* flag is set here.
"""

