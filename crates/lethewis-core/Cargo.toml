[package]
name = "lethewis-core"
description = "Key derivation, hierarchy, lifecycle and destruction. Pure logic: no network, no filesystem."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only AND MIT"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Nothing here is ready to be published. Removing this line is a deliberate act, not an oversight,
# and it is done once per crate rather than left off by default.
publish = false

# The licence travels with the crate: a published AGPL crate without its licence text would be an
# empty gesture. LICENSE here is a symlink to the one at the workspace root, so there is one source
# of truth; cargo resolves it when packaging. LICENSE-MIT is the licence of the word list.
# Only what belongs to the crate. The lint, dependency and toolchain settings live at the workspace
# root, outside this directory, and are read from the repository rather than from the package.
include = ["src/**/*", "build.rs", "README.md", "LICENSE", "LICENSE-MIT"]

[dependencies]
# Default features bring in `alloc`.
zeroize = { version = "1.9.0", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
# Default features bring in `alloc` and `oid`. `zeroize` also wipes the HMAC state inside HKDF.
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
# Default features bring in `alloc` and `getrandom`. Its `zeroize` wipes only its own temporaries.
aes-gcm-siv = { version = "0.12.1", default-features = false, features = [
  "aes",
  "zeroize",
] }
# Default features bring in `alloc`, `getrandom` and `password-hash`.
argon2 = { version = "0.6.0", default-features = false, features = ["zeroize"] }
# Compares a record's parent identifier with the unwrapping key's, and words with the list, in
# constant time.
ctutils = { version = "0.4.5", default-features = false }
# Data-independent timing on aarch64 around the derivation and the cipher.
lethewis-dit = { path = "../lethewis-dit", version = "0.0.0" }
# Direct only for `zeroize`: without it the key schedule is not wiped on drop.
aes = { version = "0.9.3", default-features = false, features = ["zeroize"] }
# The digest of a sealed chunk; `zeroize` wipes the POLYVAL state inside the cipher on drop.
polyval = { version = "0.7.3", default-features = false, features = [
  "zeroize",
] }
# Direct only for `zeroize`: without it the BLAKE2b state inside Argon2 is not wiped on drop.
blake2 = { version = "0.11.0", default-features = false, features = [
  "zeroize",
] }

# X-Wing is left out of the proofs, so Kani builds none of its code.
[target.'cfg(not(kani))'.dependencies]
# X-Wing: ML-KEM-768 with X25519. Default features bring in `alloc`; `hazmat` makes encapsulation
# from given randomness part of the documented interface.
ml-kem = { version = "0.3.3", default-features = false, features = [
  "hazmat",
  "zeroize",
] }
# Default features bring in the precomputed tables of the base point.
x25519-dalek = { version = "3.0.0", default-features = false, features = [
  "zeroize",
] }
# SHA3-256 and SHAKE256 of X-Wing; `zeroize` wipes the sponge. Default features bring in `alloc`,
# and for `sha3` also `oid`.
sha3 = { version = "0.12.0", default-features = false, features = ["zeroize"] }
shake = { version = "0.1.0", default-features = false, features = ["zeroize"] }

[lints]
workspace = true
