[package]
name = "lethewis-android"
description = "The Android platform of LetheWis: profiles on the device, the chip's answer from a key in the Android keystore, and keys held while the app shows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["cryptography"]
readme = "README.md"
publish = false
include = ["src/**/*", "README.md", "LICENSE"]

[dependencies]
# The key of an epoch from its root, and the keeper of roots the core commits through.
lethewis-core = { path = "../lethewis-core", version = "0.0.0" }
# The memory the keys of an open profile are held in.
lethewis-locked = { path = "../lethewis-locked", version = "0.0.0" }
# Compares the chip's answers with a record, and the tags of the ways in, in constant time.
ctutils = { version = "0.4.5", default-features = false }
# A root's tag covers a digest of its random bytes; `zeroize` wipes the hash state on drop.
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
# Default features bring in `alloc`.
zeroize = { version = "1.9.0", default-features = false }

[dev-dependencies]
# The stand-in for the keystore in the tests computes HMAC-SHA256 as the chip does.
hmac = { version = "0.13.0", default-features = false }

# Runs the unit tests of the keys through interleavings of their threads, under cfg(shuttle) alone.
[target.'cfg(shuttle)'.dev-dependencies]
shuttle = "0.9.9"

[lints]
workspace = true
