[package]
name = "lethewis-timelock"
description = "A time lock on the drand network quicknet. Pure logic: no network, no clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false
include = ["src/**/*", "README.md", "LICENSE"]

[dependencies]
# Default features bring in `alloc` and `oid`.
sha2 = { version = "0.11.0", default-features = false }

# The curve is a model in the proofs, so Kani builds none of its C code.
[target.'cfg(not(kani))'.dependencies]
# BLS12-381 in C and assembly; its build script turns on `std` for every target with an operating
# system. `no-threads` keeps its checks of signatures on the calling thread; `portable` picks the
# x86-64 code at run time, not by the machine that builds it.
blst = { version = "0.3.17", default-features = false, features = [
  "no-threads",
  "portable",
] }

[lints]
workspace = true
