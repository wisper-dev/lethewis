# The compiler is pinned to an exact version, never to a channel: a reproducible build and a
# proof that holds both depend on the exact toolchain. Update as a separate, deliberate step,
# together with the proof tools.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
# A bare-metal target, to build the core where there is no standard library.
targets = ["thumbv7em-none-eabihf"]
profile = "minimal"
