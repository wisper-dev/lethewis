# The compiler is pinned to an exact version, never to a channel: a reproducible build and a
# proof that holds both depend on the exact toolchain. Update as a separate, deliberate step,
# together with the proof tools.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
# The targets whose machine code is checked; the bare-metal one also builds the core where there is
# no standard library.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "thumbv7em-none-eabihf",
  "wasm32-unknown-unknown",
]
profile = "minimal"
