[workspace]
members = ["crates/lethewis-core"]
resolver = "3"

# Crates are split along the boundary of what is proven. A crate that reaches the system or the
# network is a separate crate, so the proof perimeter stays visible from the directory listing.

[workspace.package]
version = "0.0.0"
edition = "2024"
# The exact toolchain is pinned in rust-toolchain.toml; this is the minimum a consumer needs.
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["Alan Wisper <https://alanwisper.com>"]
repository = "https://github.com/wisper-dev/lethewis"
homepage = "https://github.com/wisper-dev/lethewis"
keywords = ["cryptography", "keys"]
categories = ["cryptography", "no-std"]

[workspace.lints.rust]
# No unsafe anywhere. "forbid" cannot be relaxed further down, which is the point and also the
# catch: a crate that genuinely needs unsafe (the Android binding, when it exists) cannot inherit
# these lints and must declare its own, with a written reason in front of every block.
unsafe_code = "forbid"
unreachable_pub = "deny"
# Kani sets cfg(kani) when it compiles the proofs; the build script of the core sets
# cfg(lethewis_unoptimised) when it is built without optimisation, and a build may set it itself.
unexpected_cfgs = { level = "deny", check-cfg = [
  "cfg(kani)",
  "cfg(lethewis_unoptimised)",
] }
unused_qualifications = "deny"
# missing_docs and unused_crate_dependencies are declared in the crates themselves, not here: from
# the workspace they also apply to tests, where no integration test can compile: a test is not
# documented and need not use the crate under test.

[workspace.lints.clippy]
# Correctness is a hard failure. Style and complexity are warnings that the build turns into
# failures, which keeps a local build readable while CI stays strict.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Picked individually rather than by enabling a whole fussy group.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
mem_forget = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# A library writes nothing to the terminal. An executable crate, if one is ever added, declares its
# own lints instead of inheriting these.
print_stdout = "deny"
print_stderr = "deny"
float_arithmetic = "deny"
integer_division = "deny"
arithmetic_side_effects = "deny"

[profile.release]
# A panic unwinding through the key hierarchy could leave a copy of a key behind, so a panic aborts.
# Cargo ignores this for the test and bench profiles, so tests still unwind, and a consumer's own
# profile wins over this one. Overflow checks stay on: a silent wrap in key handling is worse than a
# crash.
panic = "abort"
overflow-checks = true
debug-assertions = false
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
panic = "abort"
overflow-checks = true
