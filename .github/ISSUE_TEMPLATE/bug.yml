name: Bug report
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security problem, stop and
        [open a private report](https://github.com/wisper-dev/lethewis/security/advisories/new)
        instead. Terms:
        [SECURITY.md](https://github.com/wisper-dev/lethewis/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The crate version or commit hash.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, and for Android the device and version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence you found that shows it. Code is welcome here.
    validations:
      required: false
